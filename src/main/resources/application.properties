
spring.application.name=API-GATEWAY
server.port=8080



# EUREKA CLIENT
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true



# ORDER SERVICE ROUTE
spring.cloud.gateway.server.webflux.routes[0].id=order-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ORDERSERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/orders/**



# NOTIFICATION SERVICE ROUTE
spring.cloud.gateway.server.webflux.routes[1].id=notification-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/notifications/**


# CUSTOMER SERVICE ROUTE
spring.cloud.gateway.server.webflux.routes[2].id=customer-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/customers/**



# ACTUATOR
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read-only