spring.application.name=API-GATEWAY
server.port=${SERVER_PORT:8080}


# EUREKA CLIENT

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# ORDER SERVICE ROUTE

spring.cloud.gateway.server.webflux.routes[0].id=order-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ORDERSERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/orders/**


# NOTIFICATION SERVICE ROUTE

spring.cloud.gateway.server.webflux.routes[1].id=notification-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/notifications/**


# CUSTOMER SERVICE ROUTE

spring.cloud.gateway.server.webflux.routes[2].id=customer-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/customers/**


# INVENTORY PRODUCT ROUTE

spring.cloud.gateway.server.webflux.routes[3].id=inventory-products
spring.cloud.gateway.server.webflux.routes[3].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/products/**


# INVENTORY ROUTE

spring.cloud.gateway.server.webflux.routes[4].id=inventory-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/inventory/**