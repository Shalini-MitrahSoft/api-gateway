spring.application.name=API-GATEWAY
#server.address=0.0.0.0
server.port=${SERVER_PORT:8080}

# ACTUATOR
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=API Gateway for Order Management System


# EUREKA CLIENT
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true


# ORDER SERVICE ROUTE
spring.cloud.gateway.server.webflux.routes[0].id=order-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/orders/**



# NOTIFICATION SERVICE ROUTE
spring.cloud.gateway.server.webflux.routes[1].id=notification-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/notifications/**


# CUSTOMER SERVICE ROUTE
spring.cloud.gateway.server.webflux.routes[2].id=customer-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/customers/**



# Inventory Service
spring.cloud.gateway.server.webflux.routes[3].id=inventory-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/products/**,/api/inventory/**


# OPENAPI DOCUMENTATION ROUTES
# Each service's /v3/api-docs endpoint is exposed through a unique gateway path.
spring.cloud.gateway.server.webflux.routes[4].id=order-service-openapi
spring.cloud.gateway.server.webflux.routes[4].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/openapi/orders
spring.cloud.gateway.server.webflux.routes[4].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webflux.routes[5].id=notification-service-openapi
spring.cloud.gateway.server.webflux.routes[5].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/openapi/notifications
spring.cloud.gateway.server.webflux.routes[5].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webflux.routes[6].id=customer-service-openapi
spring.cloud.gateway.server.webflux.routes[6].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/openapi/customers
spring.cloud.gateway.server.webflux.routes[6].filters[0]=SetPath=/v3/api-docs

spring.cloud.gateway.server.webflux.routes[7].id=inventory-service-openapi
spring.cloud.gateway.server.webflux.routes[7].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/openapi/inventory
spring.cloud.gateway.server.webflux.routes[7].filters[0]=SetPath=/v3/api-docs


# SWAGGER UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.urls[0].name=Order Service
springdoc.swagger-ui.urls[0].url=/openapi/orders
springdoc.swagger-ui.urls[1].name=Customer Service
springdoc.swagger-ui.urls[1].url=/openapi/customers
springdoc.swagger-ui.urls[2].name=Inventory Service
springdoc.swagger-ui.urls[2].url=/openapi/inventory
springdoc.swagger-ui.urls[3].name=Notification Service
springdoc.swagger-ui.urls[3].url=/openapi/notifications


# ACTUATOR ROUTES
# Strip /management/{service} and forward the remaining /actuator/** path.
spring.cloud.gateway.server.webflux.routes[8].id=order-service-actuator
spring.cloud.gateway.server.webflux.routes[8].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/management/orders/actuator/**
spring.cloud.gateway.server.webflux.routes[8].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[9].id=customer-service-actuator
spring.cloud.gateway.server.webflux.routes[9].uri=lb://CUSTOMER-SERVICE
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/management/customers/actuator/**
spring.cloud.gateway.server.webflux.routes[9].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[10].id=inventory-service-actuator
spring.cloud.gateway.server.webflux.routes[10].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/management/inventory/actuator/**
spring.cloud.gateway.server.webflux.routes[10].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[11].id=notification-service-actuator
spring.cloud.gateway.server.webflux.routes[11].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[11].predicates[0]=Path=/management/notifications/actuator/**
spring.cloud.gateway.server.webflux.routes[11].filters[0]=StripPrefix=2
